name: CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read
  packages: write

jobs:
  django-tests:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  services-ci:
    uses: ./.github/workflows/services-ci.yml
    secrets: inherit

  build-image:
    needs: [django-tests, services-ci]
    if: github.event_name == 'push' && needs.django-tests.result == 'success' && needs.services-ci.result == 'success'
    uses: ./.github/workflows/build.yml
    secrets: inherit