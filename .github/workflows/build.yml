name: Build & Publish Image

permissions:
    contents: read
    packages: write
    
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/djangoimage:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/djangoimage:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image to tar.gz and upload to S3 (temporary)
        run: |
          # Install s3cmd
          sudo apt-get update
          sudo apt-get install -y s3cmd gzip

          # Write the s3cfg file from secret
          echo "${{ secrets.S3CFG_CONTENT }}" > s3cfg
          export S3CMD_CONFIG=$PWD/s3cfg

          # Pull the image from GHCR so it's available locally
          docker pull ghcr.io/${{ github.repository_owner }}/djangoimage:${{ github.sha }}

          # Save the Docker image to a tar.gz file
          docker save ghcr.io/${{ github.repository_owner }}/djangoimage:${{ github.sha }} \
            | gzip > djangoimage.tar.gz
          
          # test before upload
          s3cmd ls

          # Upload to S3 bucket
          s3cmd put djangoimage.tar.gz s3://djangoimg/djangoimage.tar.gz --acl-private --progress --verbose --debug