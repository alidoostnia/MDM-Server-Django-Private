{% extends "admin/index.html" %}
{% load static %}

{% block content %}
  {{ block.super }}

  <button
    type="button"
    class="btn btn-success rounded-pill shadow position-fixed d-inline-flex align-items-center"
    id="open-push-notif-modal"
    aria-label="Open quick push notification"
    style="right: 24px; bottom: 24px; z-index: 2000;"
  >
    <i class="fas fa-bell mr-2" aria-hidden="true"></i>
    <span class="d-none d-md-inline">Quick Push Notification</span>
  </button>

  <div id="push-notif-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:9999;">
    <div style="max-width:560px; margin:8vh auto; background:var(--mdm-surface, #fff); border-radius:8px; padding:18px; border:1px solid var(--mdm-border, #ddd);">
      <h3 style="margin-top:0;">Send Push Notification</h3>
      <form method="post" action="{% url 'admin:policies_policy_quick_push_notification' %}">
        {% csrf_token %}

        <div style="margin-bottom:10px;">
          <label for="push-title"><strong>Title *</strong></label><br>
          <input id="push-title" name="title" type="text" required style="width:100%;" />
        </div>

        <div style="margin-bottom:10px;">
          <label for="push-body"><strong>Body *</strong></label><br>
          <textarea id="push-body" name="body" required rows="3" style="width:100%;"></textarea>
        </div>

        <div style="margin-bottom:10px;">
          <label for="push-image-url">Image URL</label><br>
          <input id="push-image-url" name="image_url" type="url" class="vTextField" style="width:100%;" />
        </div>

        <div style="margin-bottom:10px;">
          <label for="push-tag">Tag (optional)</label><br>
          <input id="push-tag" name="tag" type="text" style="width:100%;" />
        </div>

        <div style="margin-bottom:10px;">
          <label for="push-target-type"><strong>Apply To *</strong></label><br>
          <select class="admin-schema-select form-control" id="push-target-type" name="target_type" required style="width:100%;">
            <option value="">Select target type</option>
            <option value="department">Department</option>
            <option value="device">Device</option>
          </select>
        </div>

        <div style="margin-bottom:14px;">
          <label for="push-target-id"><strong>Target *</strong></label><br>
          <select class="admin-schema-select form-control" id="push-target-id" name="target_id" required style="width:100%;">
            <option value="">Choose target type first</option>
          </select>
        </div>

        <div style="display:flex; gap:8px; justify-content:flex-end;">
          <button type="button" class="button admin-action-button" id="close-push-notif-modal">Cancel</button>
          <button type="submit" class="button admin-action-button">Send</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    (function() {
      const openBtn = document.getElementById('open-push-notif-modal');
      const closeBtn = document.getElementById('close-push-notif-modal');
      const modal = document.getElementById('push-notif-modal');
      const targetTypeSelect = document.getElementById('push-target-type');
      const targetSelect = document.getElementById('push-target-id');
      const optionsUrl = "{% url 'admin:policies_policy_quick_push_notification_options' %}";

      function closeModal() {
        modal.style.display = 'none';
      }

      function openModal() {
        modal.style.display = 'block';
      }

      // --- NEW LOGIC: AUTO OPEN ---
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('open_push') === '1') {
          openModal();
          // Optional: Clean the URL so refreshing doesn't keep the modal open
          window.history.replaceState({}, document.title, window.location.pathname);
      }
      // ----------------------------

      function resetTargetOptions(message) {
        targetSelect.innerHTML = '';
        const option = document.createElement('option');
        option.value = '';
        option.textContent = message;
        targetSelect.appendChild(option);
      }

      async function loadOptions() {
        const targetType = targetTypeSelect.value;
        if (!targetType) {
          resetTargetOptions('Choose target type first');
          return;
        }

        resetTargetOptions('Loading...');
        try {
          const response = await fetch(`${optionsUrl}?target_type=${encodeURIComponent(targetType)}`);
          const payload = await response.json();
          const options = payload.options || [];

          targetSelect.innerHTML = '';
          const initial = document.createElement('option');
          initial.value = '';
          initial.textContent = options.length ? 'Select target' : 'No targets found';
          targetSelect.appendChild(initial);

          options.forEach(function(item) {
            const opt = document.createElement('option');
            opt.value = item.id;
            opt.textContent = item.label;
            targetSelect.appendChild(opt);
          });
        } catch (e) {
          resetTargetOptions('Failed to load targets');
        }
      }

      openBtn.addEventListener('click', openModal);
      closeBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', function(e) {
        if (e.target === modal) closeModal();
      });
      targetTypeSelect.addEventListener('change', loadOptions);
    })();
</script>
{% endblock %}
