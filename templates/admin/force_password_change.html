{% extends "admin/base_site.html" %}

{% block content %}
<div id="content-main">
  <p>Your password has expired or an administrator has required a new password. You cannot use the admin panel until it is changed.</p>
  <form method="post" autocomplete="off" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="submit-row">
      <input type="submit" value="Change password" class="default">
    </div>
  </form>
</div>
{% endblock %}
